<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - StreamFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6 space-y-6">
    <!-- Profile Card -->
    <div class="bg-gray-800 w-full max-w-md p-6 rounded-2xl shadow-lg">
        <div class="flex flex-col items-center space-y-3">
            <div class="relative w-20 h-20 rounded-full overflow-hidden border-4 border-red-500">
                <img id="profile-picture" src="images/profile-placeholder.png" alt="Profile Picture" class="w-full h-full object-cover">
                <label for="profile-picture-upload" class="absolute bottom-0 right-0 bg-red-500 text-white p-1 rounded-full cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                </label>
                <input type="file" id="profile-picture-upload" class="hidden" accept="image/*">
            </div>
            <h2 id="profile-name" class="text-xl font-semibold">User Name</h2>
            <p id="profile-role" class="text-gray-400">Subscription: None</p>
        </div>
    </div>

    <!-- Subscription Details Section -->
    <div class="bg-gray-800 w-full max-w-md p-6 rounded-2xl shadow-lg">
        <h3 class="text-lg font-semibold mb-4">Subscription Details</h3>
        <div id="subscription-details" class="space-y-2">
            <p><strong>Subscription Model:</strong> <span id="subscription-model">None</span></p>
            <p><strong>Last Payment:</strong> <span id="last-payment">No payments found</span></p>
        </div>
    </div>

    <!-- Edit Profile Section -->
    <div class="bg-gray-800 w-full max-w-md p-6 rounded-2xl shadow-lg">
        <h3 class="text-lg font-semibold mb-4">Edit Profile</h3>
        <form id="profile-form" class="space-y-4">
            <div>
                <label for="email" class="block text-sm text-gray-400 mb-1">Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white" value="user@example.com" disabled>
            </div>
            <div>
                <label for="username" class="block text-sm text-gray-400 mb-1">Username</label>
                <input type="text" id="username" class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white" placeholder="Enter your username">
            </div>
            <button type="button" id="save-button" class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">Save Changes</button>
        </form>
    </div>

    <!-- Account Actions -->
    <div class="flex flex-col items-center w-full max-w-md space-y-2">
        <button class="w-full bg-gray-700 text-blue-400 py-2 rounded-lg hover:bg-gray-600">Switch to Other Account</button>
        <button id="logout-button" class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 flex items-center justify-center">
            Log Out
        </button>
    </div>

    <script>
        // Fetch user data and populate the profile
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Please log in to view your profile.');
            window.location.href = 'index.html';
        } else {
            fetch('http://localhost:3002/profile', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('profile-name').textContent = data.user.name || 'User Name';
                    document.getElementById('profile-role').textContent = `Subscription: ${data.user.subscription || 'None'}`;
                    document.getElementById('email').value = data.user.email;
                    document.getElementById('username').value = data.user.name || '';
                    if (data.user.profilePicture) {
                        document.getElementById('profile-picture').src = data.user.profilePicture;
                    }
                    // Populate subscription details
                    document.getElementById('subscription-model').textContent = data.user.subscription || 'None';
                    if (data.user.lastPayment) {
                        document.getElementById('last-payment').textContent = `$${data.user.lastPayment.amount} on ${new Date(data.user.lastPayment.date).toLocaleDateString()}`;
                    }
                } else {
                    alert('Failed to fetch profile data.');
                    window.location.href = 'index.html';
                }
            })
            .catch(error => console.error('Error fetching profile:', error));
        }

        // Save updated profile data
        document.getElementById('save-button').addEventListener('click', () => {
            const updatedData = {
                name: document.getElementById('username').value,
            };
            fetch('http://localhost:3002/profile', {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(updatedData),
            })
            .then(response => response.json())
            .then(updateResponse => {
                if (updateResponse.success) {
                    alert('Profile updated successfully!');
                    window.location.reload();
                } else {
                    alert('Failed to update profile.');
                }
            })
            .catch(error => console.error('Error updating profile:', error));
        });

        // Handle profile picture upload
        document.getElementById('profile-picture-upload').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('profile-picture').src = e.target.result;

                    // Save the uploaded image to the backend
                    fetch('http://localhost:3002/profile-picture', {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ profilePicture: e.target.result }),
                    })
                    .then(response => response.json())
                    .then(updateResponse => {
                        if (updateResponse.success) {
                            alert('Profile picture updated successfully!');
                        } else {
                            alert('Failed to update profile picture.');
                        }
                    })
                    .catch(error => console.error('Error updating profile picture:', error));
                };
                reader.readAsDataURL(file);
            }
        });

        // Log out functionality
        document.getElementById('logout-button').addEventListener('click', () => {
            localStorage.removeItem('token');
            alert('You have been logged out.');
            window.location.href = 'index.html';
        });

        function fetchProfile() {
            const token = localStorage.getItem('token'); // Retrieve the token from localStorage

            fetch('http://localhost:3002/profile', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('subscription-model').textContent = data.user.subscription || 'None';
                } else {
                    alert('Failed to fetch profile data.');
                }
            })
            .catch(error => console.error('Error fetching profile:', error));
        }

        // Fetch profile data on page load
        window.onload = fetchProfile;
    </script>

    <h1>Profile</h1>
    <p>Subscription Model: <span id="subscription-model">Loading...</span></p>
</body>
</html>
