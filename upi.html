<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment - StreamFlix</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: url('images/contentupiback.jpg') no-repeat center center/cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background-color: rgba(45, 55, 72, 0.9); /* Slightly transparent */
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            max-width: 500px;
            width: 100%;
        }
        .container h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .container p {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }
        .container input, .container button {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: none;
            outline: none;
        }
        .container input {
            background-color: #4a5568;
            color: #fff;
        }
        .container button {
            background-color: #e50914;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .container button:hover {
            background-color: #b81d24;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-4xl font-bold mb-4">UPI Payment</h1>
        <p class="text-xl mb-8">You have selected the <span id="plan-name"></span> plan.</p>
        <p class="text-xl mb-8">Amount to pay: ₹<span id="plan-price"></span>/month</p>
        <div class="mb-8">
            <input type="text" placeholder="UPI ID" class="bg-gray-700 p-2 rounded mb-4 w-full" id="upi-id" />
        </div>
        <button id="pay-button" class="bg-red-600 px-4 py-2 rounded hover:bg-red-700">Pay Now</button>
        <div id="payment-message" class="hidden text-red-500 mt-4"></div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const planName = urlParams.get('plan');
        const planPrice = urlParams.get('price');

        // Set plan details in the page
        document.getElementById('plan-name').textContent = planName;
        document.getElementById('plan-price').textContent = planPrice;

        document.getElementById('pay-button').addEventListener('click', () => {
            const upiId = document.getElementById('upi-id').value;
            if (upiId) {
                const options = {
                    key: 'rzp_test_S9tPMi5NxCkLcE', // Your Razorpay test key
                    amount: planPrice * 100, // Amount in paise (₹1 = 100 paise)
                    currency: 'INR',
                    name: 'StreamFever',
                    description: `Payment for ${planName} plan`,
                    image: 'logoStreamFever.png', // Replace with your logo URL
                    handler: function (response) {
                        // Store the subscription plan in localStorage
                        localStorage.setItem('subscriptionPlan', planName);

                        // Redirect to the content page
                        window.location.href = 'content.html';
                    },
                    prefill: {
                        email: 'user@example.com', // Replace with the user's email
                        contact: '9999999999' // Replace with the user's phone number
                    },
                    theme: {
                        color: '#e50914'
                    },
                    method: {
                        upi: true // Enable UPI payments
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();
            } else {
                document.getElementById('payment-message').textContent = 'Please enter a valid UPI ID.';
                document.getElementById('payment-message').classList.remove('hidden');
            }
        });

        function handlePayment(amount) {
            const token = localStorage.getItem('token'); // Retrieve the token from localStorage

            fetch('http://localhost:3002/pay', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ amount }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Payment successful!');
                    window.location.href = 'profile.html'; // Redirect to profile page
                } else {
                    alert('Payment failed: ' + data.message);
                }
            })
            .catch(error => console.error('Error processing payment:', error));
        }
    </script>

    <button onclick="handlePayment(500)">Pay Now</button>
</body>
</html>
